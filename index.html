<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef4ff">
<title>ふしぎもじ そだつロボ</title>
<style>
:root{font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;color:#2b3552;background:#eff4ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0%,#fff0db 0,transparent 38%),radial-gradient(circle at 100% 12%,#dfe8ff 0,transparent 36%),#eff4ff}
main{max-width:580px;margin:0 auto;padding:16px 14px calc(28px + env(safe-area-inset-bottom))}
header{text-align:center;margin-bottom:14px}h1{margin:4px 0 6px;font-size:clamp(26px,7vw,36px);color:#4457c7}header p{margin:0;color:#7180ad;font-weight:800;font-size:13px}
.panel{background:#fff;border:2px solid #e0e7ff;border-radius:24px;padding:15px;margin-bottom:14px;box-shadow:0 8px 0 #dde4fb}
.label{display:flex;align-items:center;gap:7px;font-weight:900;font-size:16px;margin-bottom:9px;color:#33407b}.row{display:flex;gap:8px;align-items:stretch}
#word{flex:1;min-width:0;border:3px solid #c9d5ff;border-radius:16px;padding:14px 13px;font-size:19px;line-height:1.4;background:#fcfdff;color:#304069;outline:none}#word:focus{border-color:#7088ff;box-shadow:0 0 0 4px #7d91f51f}#word.pop{animation:pop .18s ease-out}@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.024)}100%{transform:scale(1)}}
button{font:inherit;border:0;cursor:pointer;font-weight:900;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:active{transform:translateY(2px)}button:focus-visible{outline:3px solid #111;outline-offset:3px}
.smallbtn{background:#f3f6ff;color:#4d62c9;border-radius:15px;padding:0 12px;min-width:74px;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{background:#eef2ff;color:#4d62c9;border:2px solid #dbe4ff;border-radius:999px;padding:8px 12px;min-width:48px;min-height:42px;font-size:18px}
.help{font-size:12px;color:#6f7ca8;margin:8px 0 0;font-weight:700}.livebox{margin-top:10px;background:#f7f9ff;border:2px dashed #dbe2ff;border-radius:15px;padding:10px 12px;color:#51608f;font-size:13px;font-weight:800}
.stage{position:relative;min-height:360px;border-radius:26px;overflow:hidden;background:radial-gradient(circle at 50% 28%,#fff 10%,#edf2ff 62%,#dfe7ff 100%);border:3px solid #fff;isolation:isolate}.stage:before{content:"";position:absolute;left:-18%;right:-18%;height:104px;bottom:-44px;background:#d7dffd;border-radius:50%;opacity:.8}
#robot{display:block;width:100%;height:330px;position:relative;z-index:2;filter:drop-shadow(0 10px 4px #7b86bd33);transform-origin:50% 84%;cursor:pointer}#robot.bounce{animation:bounce .8s cubic-bezier(.22,.7,.3,1)}#robot.dance{animation:dance .65s ease-in-out 2}@keyframes bounce{0%{transform:scale(.55) translateY(110px);opacity:.2}45%{transform:scale(1.08) translateY(-16px);opacity:1}75%{transform:scale(.97)}100%{transform:scale(1)}}@keyframes dance{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) translateY(-4px)}75%{transform:rotate(8deg) translateY(-8px)}}
.speech{position:absolute;top:12px;left:12px;right:12px;z-index:4;text-align:center;pointer-events:none}.speech span{display:inline-block;background:#fff;border:2px solid #becdff;border-radius:18px;padding:6px 13px;box-shadow:0 3px 0 #d6defb;font-size:15px;font-weight:900;max-width:100%;overflow-wrap:anywhere}
.identity{text-align:center;padding:10px 2px 5px}.identity strong{display:block;font-size:21px;color:#33439b;overflow-wrap:anywhere}.identity small{display:block;color:#7180ad;font-size:13px;margin-top:4px;font-weight:800}
.growmeta{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:10px}.meter{height:18px;background:#edf1ff;border-radius:999px;border:2px solid #d9e0ff;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#7d92ff,#53cdf0);border-radius:999px;transition:width .24s ease}.stagebadge{background:#f0f4ff;color:#4361d2;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900;white-space:nowrap}
.used{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}.glyph{min-width:40px;height:40px;border-radius:12px;background:#f3f6ff;border:2px solid #dfe5ff;display:inline-flex;align-items:center;justify-content:center;font-size:21px;color:#4b5fc5;box-shadow:0 3px 0 #e1e6fb}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:11px}.action{min-height:52px;border-radius:15px;padding:11px 4px;font-size:15px}.action:nth-child(1){background:#ffe9a8;color:#7c5a10;box-shadow:0 4px 0 #ecd796}.action:nth-child(2){background:#dff4ff;color:#2f5e94;box-shadow:0 4px 0 #c9e1ee}.action:nth-child(3){background:#ffe0ec;color:#9b4376;box-shadow:0 4px 0 #ebc8d7}
.star{position:absolute;z-index:3;pointer-events:none;font-size:26px;animation:star .95s ease-out both}@keyframes star{from{opacity:1;transform:translateY(12px) scale(.7) rotate(-20deg)}to{opacity:0;transform:translateY(-92px) scale(1.45) rotate(25deg)}}
.galleryhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.galleryhead b{font-size:16px;color:#33407b}.clear{background:transparent;color:#7a84ab;text-decoration:underline;font-size:12px}.gallery{display:flex;gap:8px;overflow-x:auto;min-height:88px;padding:8px 2px 4px}.card{flex:0 0 auto;min-width:90px;max-width:92px;background:#fafbff;border:2px solid #e0e7ff;border-radius:15px;padding:8px 6px;text-align:center;color:#4f5d8f}.card .mini{font-size:35px;display:block}.card .t{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{align-self:center;color:#8b95bf;font-size:13px;padding:12px}
footer{text-align:center;color:#95a0c9;font-size:11px;padding-top:2px}
@media(max-width:390px){main{padding-left:10px;padding-right:10px}.panel{padding:12px}.actions{gap:6px}.action{font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main>
<header>
  <h1>⚡ ふしぎもじ そだつロボ</h1>
  <p>ロボットを みながら、もじを いれて そだてよう！</p>
</header>

<section class="panel" aria-label="そだっているロボット">
  <div class="stage" id="stage">
    <div class="speech"><span id="bubble">もじを いれて そだててね！</span></div>
    <svg id="robot" viewBox="0 0 360 345" role="img" aria-label="そだっているロボット"></svg>
  </div>
  <div class="identity">
    <strong id="name">たまごロボ</strong>
    <small id="stats">もじ 0こ ・ レベル 0</small>
    <div class="growmeta">
      <div class="meter" aria-label="そだちメーター"><div id="fill" class="fill"></div></div>
      <span id="stageLabel" class="stagebadge">たまご</span>
    </div>
    <div id="used" class="used"></div>
  </div>
  <div class="actions">
    <button class="action" type="button" id="dance">💃 おどる</button>
    <button class="action" type="button" id="speak">💬 おしゃべり</button>
    <button class="action" type="button" id="save">🌟 ほぞん</button>
  </div>
</section>


<section class="panel">
  <label class="label" for="word">⌨️ ふしぎな もじを いれてね</label>
  <div class="row">
    <input id="word" maxlength="60" value="にょならはわわょわやゆ" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="ふしぎな文字">
    <button class="smallbtn" id="surprise" type="button">🎲<br>おまかせ</button>
  </div>
  <div class="chips" aria-label="もじを たす">
    <button class="chip" type="button" data-add="にょ">にょ</button>
    <button class="chip" type="button" data-add="わ">わ</button>
    <button class="chip" type="button" data-add="ゆ">ゆ</button>
    <button class="chip" type="button" data-add="ぽ">ぽ</button>
    <button class="chip" type="button" data-add="☆">☆</button>
    <button class="chip" type="button" data-add="！">！</button>
  </div>
  <p class="help">入力するとすぐにロボットが育つよ。おなじ文字でも、ならびがちがうと別のロボになる！</p>
  <div class="livebox">✨ 入れた文字の <b>先頭・まんなか・最後</b> の3文字を、ロボットの見た目に取りこむよ。</div>
</section>

<section class="panel">
  <div class="galleryhead"><b>🌈 できた ロボたち <span id="count">0</span></b><button type="button" class="clear" id="clear">ぜんぶ けす</button></div>
  <div class="gallery" id="gallery"><span class="empty">ロボを ほぞんすると ここに ならぶよ</span></div>
</section>

<footer>おおきな ロボットを みながら そだてよう</footer>
</main>
<script>
(()=>{
'use strict';
const $ = id => document.getElementById(id);
const input = $('word'), svg = $('robot'), stage = $('stage'), bubble = $('bubble');
const STAGES = [
  {label:'たまご', msg:'もじを いれて そだててね！'},
  {label:'あたま', msg:'あたまが できてきた！'},
  {label:'からだ', msg:'からだが つながったよ！'},
  {label:'うで', msg:'うでが のびた！'},
  {label:'あし', msg:'あしで たてるようになった！'},
  {label:'アンテナ', msg:'アンテナで でんぱキャッチ！'},
  {label:'そうび', msg:'きらきら そうびが ついた！'},
  {label:'かんせい', msg:'すごい！ さいきょうロボ かんせい！'}
];
let currentText = input.value, animateTimer = null, ac = null, gallery = loadGallery();
function hash(s){let h=2166136261; for(const ch of s){h ^= ch.codePointAt(0); h = Math.imul(h, 16777619)} return h>>>0}
function rnd(seed,n){return ((seed>>>((n*7)%25)) ^ (seed*13+n*769))>>>0}
function range(seed,n,max){return rnd(seed,n)%max}
function palette(seed){const hue = range(seed,1,360); return {base:`hsl(${hue} 78% 65%)`, dark:`hsl(${hue} 58% 40%)`, light:`hsl(${hue} 95% 88%)`, extra:`hsl(${(hue+130)%360} 80% 68%)`, gold:'#ffe067', danger:'#ff9dbd'}}
function stageLevel(text){const len = Array.from((text||'').trim()).length; return Math.max(0, Math.min(7, len));}
function featureChars(text){const chars = Array.from((text||'ふしぎ').trim()||'ふしぎ'); if(chars.length===0) return ['ふ','し','ぎ']; if(chars.length===1) return [chars[0],chars[0],chars[0]]; if(chars.length===2) return [chars[0],chars[1],chars[0]]; return [chars[0], chars[Math.floor((chars.length-1)/2)], chars[chars.length-1]];}
function esc(s){return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function haptic(pattern=10){try{ if('vibrate' in navigator) navigator.vibrate(pattern);}catch{}}
function beep(freq=450){try{ ac = ac || new(window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(freq, ac.currentTime); o.frequency.exponentialRampToValueAtTime(freq*1.18, ac.currentTime+.12); g.gain.setValueAtTime(.05, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+.16); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+.17);}catch{}}
function popInput(){input.classList.remove('pop'); void input.offsetWidth; input.classList.add('pop'); setTimeout(()=>input.classList.remove('pop'),200)}
function stars(n=8){for(let i=0;i<n;i++){const s=document.createElement('span'); s.className='star'; s.textContent=['✨','⭐','💫','🌟'][i%4]; s.style.left=`${12+Math.random()*76}%`; s.style.top=`${16+Math.random()*54}%`; s.style.animationDelay=`${Math.random()*.2}s`; stage.append(s); setTimeout(()=>s.remove(),1000)}}
function animate(kind='bounce'){clearTimeout(animateTimer); svg.classList.remove('bounce','dance'); void svg.getBoundingClientRect(); svg.classList.add(kind); animateTimer=setTimeout(()=>svg.classList.remove(kind),1400)}
function renderUsed(chars){const box=$('used'); box.replaceChildren(); chars.forEach(ch=>{const s=document.createElement('span'); s.className='glyph'; s.textContent=ch; box.append(s);})}
function robotSvg(text){
  const seed = hash(text || 'たまご');
  const c = palette(seed);
  const level = stageLevel(text);
  const [a,b,d] = featureChars(text).map(esc);
  const eyeStyle = range(seed,2,3);
  const mouthStyle = range(seed,3,3);
  const armStyle = range(seed,4,3);
  const feetStyle = range(seed,5,3);
  const badgeStyle = range(seed,6,3);
  const head = `<g><rect x="101" y="74" width="158" height="120" rx="30" fill="${c.base}" stroke="${c.dark}" stroke-width="7"/><path d="M124 98 H236" stroke="#fff" stroke-opacity=".7" stroke-width="8" stroke-linecap="round"/>${eyeStyle===0?`<circle cx="148" cy="132" r="17" fill="#fff"/><circle cx="212" cy="132" r="17" fill="#fff"/><circle cx="153" cy="136" r="8" fill="#25314f"/><circle cx="217" cy="136" r="8" fill="#25314f"/>`:eyeStyle===1?`<rect x="126" y="116" width="108" height="34" rx="16" fill="#2a3357"/><circle cx="148" cy="133" r="11" fill="#8af3ff"/><circle cx="212" cy="133" r="11" fill="#8af3ff"/>`:`<path d="M130 129 L164 131 M196 131 L230 129" stroke="#22314a" stroke-width="12" stroke-linecap="round"/>`}${mouthStyle===0?`<path d="M156 165 Q180 183 204 165" fill="none" stroke="#5a3554" stroke-width="6" stroke-linecap="round"/>`:mouthStyle===1?`<rect x="148" y="157" width="64" height="18" rx="8" fill="#fff" stroke="#5d4165" stroke-width="4"/><path d="M164 158 V174 M180 158 V174 M196 158 V174" stroke="#5d4165" stroke-width="3"/>`:`<circle cx="180" cy="166" r="13" fill="#ff93b5" stroke="#654060" stroke-width="4"/>`}<text x="180" y="118" font-size="39" text-anchor="middle" font-weight="900" fill="#fff" stroke="#4154ad" stroke-width="5" paint-order="stroke">${a}</text></g>`;
  const bodyBadge = badgeStyle===0 ? `<circle cx="180" cy="239" r="18" fill="${c.extra}" stroke="${c.dark}" stroke-width="5"/><text x="180" y="246" font-size="22" text-anchor="middle" font-weight="900" fill="#fff" stroke="#5162b8" stroke-width="3" paint-order="stroke">${b}</text>` : badgeStyle===1 ? `<rect x="157" y="221" width="46" height="35" rx="12" fill="${c.extra}" stroke="${c.dark}" stroke-width="5"/><text x="180" y="245" font-size="22" text-anchor="middle" font-weight="900" fill="#fff" stroke="#5162b8" stroke-width="3" paint-order="stroke">${b}</text>` : `<path d="M180 218 L194 234 L180 250 L166 234Z" fill="${c.extra}" stroke="${c.dark}" stroke-width="5"/><text x="180" y="241" font-size="21" text-anchor="middle" font-weight="900" fill="#fff" stroke="#5162b8" stroke-width="3" paint-order="stroke">${b}</text>`;
  const body = `<g><rect x="118" y="193" width="124" height="88" rx="23" fill="${c.base}" stroke="${c.dark}" stroke-width="7"/><rect x="130" y="205" width="100" height="64" rx="15" fill="${c.light}"/>${bodyBadge}<text x="214" y="264" font-size="26" text-anchor="middle" font-weight="900" fill="#fff3a0" stroke="#5d45af" stroke-width="4" paint-order="stroke">${d}</text></g>`;
  const arms = armStyle===0 ? `<path d="M117 215 L76 203 L58 226 M243 215 L284 203 L302 226" fill="none" stroke="${c.dark}" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>` : armStyle===1 ? `<path d="M117 217 Q84 192 58 214 Q75 235 69 253 M243 217 Q276 192 302 214 Q285 235 291 253" fill="none" stroke="${c.dark}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>` : `<path d="M117 216 L79 232 L59 215 M243 216 L281 232 L301 215" fill="none" stroke="${c.dark}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>`;
  const hands = `<circle cx="55" cy="228" r="17" fill="${c.extra}" stroke="${c.dark}" stroke-width="6"/><circle cx="305" cy="228" r="17" fill="${c.extra}" stroke="${c.dark}" stroke-width="6"/>`;
  const legs = `<path d="M144 279 V309 M216 279 V309" stroke="${c.dark}" stroke-width="16" stroke-linecap="round"/>`;
  const feet = feetStyle===0 ? `<rect x="110" y="298" width="58" height="16" rx="8" fill="${c.dark}"/><rect x="192" y="298" width="58" height="16" rx="8" fill="${c.dark}"/>` : feetStyle===1 ? `<circle cx="141" cy="304" r="19" fill="${c.dark}"/><circle cx="219" cy="304" r="19" fill="${c.dark}"/><circle cx="141" cy="304" r="8" fill="${c.light}"/><circle cx="219" cy="304" r="8" fill="${c.light}"/>` : `<path d="M114 294 H167 L160 314 H108Z M194 294 H246 L252 314 H201Z" fill="${c.dark}"/>`;
  const antenna = `<line x1="180" y1="74" x2="180" y2="42" stroke="${c.dark}" stroke-width="10" stroke-linecap="round"/><circle cx="180" cy="39" r="12" fill="${c.extra}" stroke="${c.dark}" stroke-width="4"/><path d="M145 82 L126 54 M215 82 L234 54" stroke="${c.dark}" stroke-width="8" stroke-linecap="round"/><circle cx="124" cy="52" r="9" fill="${c.gold}"/><circle cx="236" cy="52" r="9" fill="${c.gold}"/>`;
  const gear = `<g><path d="M108 104 L93 92 L101 76 L84 69 L87 49 L107 51 L117 35 L134 47 L150 41 L158 60 L147 76 L126 76 Z" fill="${c.gold}" stroke="${c.dark}" stroke-width="5" stroke-linejoin="round" opacity=".95"/><path d="M251 93 L268 78 L286 88 L289 67 L310 64 L314 84 L331 92 L322 109 L334 124 L318 137 L300 128 L286 143 L270 130 L273 110 Z" fill="${c.extra}" stroke="${c.dark}" stroke-width="5" stroke-linejoin="round" opacity=".95"/></g>`;
  const aura = level>=7 ? `<circle cx="180" cy="176" r="148" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="10"/><circle cx="180" cy="176" r="158" fill="none" stroke="#8dcfff" stroke-opacity=".45" stroke-width="12"/>` : `<circle cx="180" cy="176" r="148" fill="url(#halo)"/>`;
  let parts = '';
  if(level>=1) parts += head;
  if(level>=2) parts += body;
  if(level>=3) parts += arms + hands;
  if(level>=4) parts += legs + feet;
  if(level>=5) parts += antenna;
  if(level>=6) parts += gear;
  if(level===0){parts += `<g><ellipse cx="180" cy="228" rx="68" ry="84" fill="${c.base}" stroke="${c.dark}" stroke-width="7"/><ellipse cx="180" cy="233" rx="42" ry="56" fill="${c.light}"/><text x="180" y="240" font-size="54" text-anchor="middle">🥚</text></g>`;}
  return `<defs><radialGradient id="halo"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><ellipse cx="180" cy="321" rx="105" ry="12" fill="#6675aa" opacity=".18"/>${aura}${parts}`;
}
function robotName(text){const chars = Array.from((text||'').trim()); if(chars.length===0) return 'たまごロボ'; const short = chars.slice(0,6).join(''); return `${short}${chars.length>6?'…':''}ロボ`;}
function updateLive(source='typing'){
  const text = input.value.trim();
  currentText = text;
  const level = stageLevel(text);
  const count = Array.from(text).length;
  const info = STAGES[level];
  svg.innerHTML = robotSvg(text);
  svg.setAttribute('aria-label', `${robotName(text)} が そだっているよ`);
  $('name').textContent = robotName(text);
  $('stats').textContent = `もじ ${count}こ ・ レベル ${level}`;
  $('stageLabel').textContent = info.label;
  $('fill').style.width = `${(level/7)*100}%`;
  renderUsed(featureChars(text));
  if(source==='typing'){
    bubble.textContent = count===0 ? info.msg : `${info.msg}（${count}もじ）`;
  } else {
    bubble.textContent = info.msg;
  }
}
function celebrate(){animate('bounce'); stars(10); haptic([16,22,18]); beep(560)}
function speak(){const level = stageLevel(currentText); const lines = [
  'もじを まってるよ！',
  'あたま できた！',
  'からだ しっかり！',
  'うでを ぶんぶん！',
  'あしで たてたよ！',
  'でんぱ ピピッ！',
  'そうび かっこいい！',
  'ぼく、かんせい！'
]; bubble.textContent = lines[level]; animate('dance'); haptic(10); beep(380)}
function saveCurrent(){
  if(!currentText.trim()) { bubble.textContent='まずは もじを いれてね！'; haptic(10); return; }
  gallery = [{text:currentText}, ...gallery.filter(x=>x.text!==currentText)].slice(0,18); saveGallery(gallery); renderGallery(); bubble.textContent = 'ほぞん できたよ！'; celebrate();
}
function renderGallery(){const box=$('gallery'); box.replaceChildren(); $('count').textContent = gallery.length; if(!gallery.length){const e=document.createElement('span'); e.className='empty'; e.textContent='ロボを ほぞんすると ここに ならぶよ'; box.append(e); return;} gallery.forEach(item=>{const b=document.createElement('button'); b.type='button'; b.className='card'; b.innerHTML = `<span class="mini">🤖</span><span class="t"></span>`; b.querySelector('.t').textContent=item.text; b.addEventListener('click',()=>{input.value=item.text; updateLive('gallery'); celebrate();}); box.append(b);});}
function loadGallery(){try{const a=JSON.parse(localStorage.getItem('live-grow-robots')||'[]'); return Array.isArray(a)?a.filter(x=>x&&typeof x.text==='string').slice(0,18):[]}catch{return []}}
function saveGallery(a){try{localStorage.setItem('live-grow-robots', JSON.stringify(a))}catch{}}
function playfulFeedback(){haptic(8); popInput(); beep(500)}
$('surprise').addEventListener('click',()=>{const chars=['にょ','わ','ぽ','が','ゆ','ぷ','あ','ぞ','！','きゅ','る','☆','にゃ','も','や','ぐ']; const n=5+Math.floor(Math.random()*8); input.value = Array.from({length:n},()=>chars[Math.floor(Math.random()*chars.length)]).join(''); updateLive('surprise'); celebrate();});
document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{input.value = (input.value + b.dataset.add).slice(0,60); playfulFeedback(); updateLive('typing');}));
input.addEventListener('input',()=>{playfulFeedback(); const prev = stageLevel(currentText); updateLive('typing'); const next = stageLevel(input.value.trim()); if(next>prev){celebrate();} else {svg.classList.remove('bounce');}});
input.addEventListener('keydown',e=>{if(e.key==='Backspace'){haptic(8); popInput(); setTimeout(()=>updateLive('typing'),0)} if(e.key==='Enter'&&!e.isComposing){e.preventDefault(); saveCurrent();}});
$('dance').addEventListener('click',()=>{bubble.textContent='ダンス かいし！'; animate('dance'); haptic([12,18,12]); stars(6); beep(420)});
$('speak').addEventListener('click', speak);
$('save').addEventListener('click', saveCurrent);
svg.addEventListener('click', speak);
$('clear').addEventListener('click',()=>{haptic(12); if(gallery.length && confirm('ほぞんした ロボを ぜんぶ けしても いい？')){gallery=[]; saveGallery(gallery); renderGallery(); bubble.textContent='ギャラリーを けしたよ';}});
renderGallery(); updateLive('init');
})();
</script>
</body>
</html>
