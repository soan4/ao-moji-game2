<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8e5"><title>もじへんしんロボ</title>
<style>
:root{--blue:#149fc4;--yellow:#ffcb3c;--red:#f2554f;--ink:#25465c}*{box-sizing:border-box}html,body{margin:0;font-family:ui-rounded,"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",system-ui,sans-serif;color:var(--ink);background:#fffaf0}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #2875e8;outline-offset:2px}.app{max-width:680px;margin:auto;padding:10px 12px 32px}.header{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-size:clamp(20px,5.5vw,31px);font-weight:1000;letter-spacing:-.06em;white-space:nowrap;color:#e95445;background:white;border:5px solid var(--yellow);border-radius:24px;padding:7px 12px;box-shadow:0 5px 0 #df9b20}.title span{color:var(--blue)}.tinybtn{border:0;background:#22abc8;border-radius:16px;color:white;font-weight:900;padding:11px 9px;min-width:56px;box-shadow:0 4px 0 #0a779d}.intro{text-align:center;font-size:12px;font-weight:800;color:#68808d;margin:10px 0 0}.robot-stage{position:relative;background:radial-gradient(circle at 50% 43%,#fff 25%,#eaf8f8 100%);border:3px solid #b8e6ed;border-radius:28px;margin-top:10px;min-height:290px;overflow:hidden}.stage-top{position:absolute;top:10px;left:12px;z-index:2;background:#fff;box-shadow:0 2px 0 #c9e7e7;border-radius:30px;padding:5px 12px;font-size:12px;font-weight:900}.robot-wrap{height:298px;display:flex;align-items:center;justify-content:center}.robot-wrap svg{height:100%;max-width:100%;overflow:visible;filter:drop-shadow(0px 5px 0px #d7e7ed)}.stage-name{position:absolute;bottom:8px;right:10px;background:#fff;border:2px solid #f3d773;border-radius:30px;padding:5px 12px;font-weight:900;font-size:13px}.stage-spark{position:absolute;font-size:23px;color:#f6c83c;pointer-events:none}.s1{top:66px;left:11%}.s2{top:88px;right:9%}.robot-stage.pop svg{animation:pop .32s ease}@keyframes pop{0%{transform:scale(.94) rotate(-3deg)}65%{transform:scale(1.06) rotate(3deg)}100%{transform:scale(1)}}.console{margin-top:12px;background:#ffe383;border-radius:26px;border:3px solid #f9c64a;padding:12px;box-shadow:0 5px 0 #eacb6e}.section-label{background:#169bc4;color:white;border-radius:14px;padding:7px 13px;text-align:center;font-weight:1000;letter-spacing:.04em}.typing{background:white;border:3px solid #65cbe0;border-radius:18px;margin-top:10px;padding:6px 12px;display:flex;align-items:center}.typing input{width:100%;border:0;outline:0;font-size:25px;font-weight:900;color:#51344e;min-height:47px;background:transparent}.typing input::placeholder{color:#9bb5bd;font-size:18px}.typing button{border:0;background:#e9f6f7;border-radius:14px;padding:9px;font-size:14px;font-weight:900;color:#37849d}.hint{font-size:11px;color:#635e55;font-weight:800;margin:8px 4px 0}.big{display:block;width:100%;border:none;border-radius:50px;color:white;font-size:27px;font-weight:1000;padding:13px;background:linear-gradient(#ff7470,#ec4151);box-shadow:0 6px 0 #c32940;margin-top:12px}.big:active{transform:translateY(4px);box-shadow:0 2px 0 #c32940}.panel{margin-top:15px;background:white;border:2px solid #d5ebf1;border-radius:24px;padding:12px}.panel h2{margin:0 0 10px;font-size:16px;color:#167b9b}.styles{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.stylebtn{background:#ecf8fb;border:3px solid transparent;border-radius:15px;min-height:66px;padding:3px}.stylebtn.active{border-color:#ffbc22;background:#fff6da}.stylebtn svg{width:100%;height:55px}.colors{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.swatch{width:35px;height:35px;border:3px solid white;outline:2px solid #e1e7eb;border-radius:50%;padding:0}.swatch.active{outline:4px solid #f5c72d}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.action{font-weight:900;border:0;border-radius:18px;padding:13px 4px;color:white;font-size:14px;min-height:65px}.save{background:#76ba24}.book{background:#21aad1}.reset{background:#e858a9}.gallery{display:none;margin-top:13px}.gallery.open{display:block}.saves{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.saved{border:2px solid #b6e7e9;border-radius:15px;background:#f3fbfd;padding:7px 3px;min-width:0;font-weight:900}.saved svg{height:75px;width:100%}.saved small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{font-size:13px;color:#667}.footer{text-align:center;color:#82949b;font-size:11px;padding:15px 0}.visually-hidden{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}@media(max-height:720px){.robot-wrap{height:250px}.robot-stage{min-height:247px}}@media(max-width:350px){.app{padding:8px}.title{font-size:19px;padding:7px}.robot-wrap{height:255px}.robot-stage{min-height:252px}.action{font-size:12px}}

/* iOS Safari: keep both the full robot and its input in the visual viewport above the software keyboard. */
.play-dock{min-width:0}
body.keyboard-open{overflow:hidden}
.keyboard-open .play-dock{position:fixed!important;left:0;right:0;top:var(--visual-top,0px);height:var(--visual-height,100dvh);z-index:1000;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;max-width:680px;margin:0 auto;padding:5px 10px 8px;background:#fffaf0;overflow:hidden}
.keyboard-open .robot-stage{flex:1 1 auto;min-height:0!important;margin-top:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.keyboard-open .robot-wrap{height:100%!important;width:100%;min-height:0;padding:15px 0 5px}
.keyboard-open .robot-wrap svg{height:100%;max-height:100%;width:auto;max-width:100%}
.keyboard-open .console{flex:0 0 auto;margin:0;padding:8px 10px;border-radius:20px;box-shadow:none}
.keyboard-open .section-label{padding:5px 9px;font-size:14px}
.keyboard-open .typing{margin-top:6px;padding:2px 9px}
.keyboard-open .typing input{min-height:43px;font-size:24px}
.keyboard-open .console .hint,.keyboard-open .console .big{display:none}
.keyboard-open .stage-top{top:5px;font-size:11px}
.keyboard-open .stage-name{bottom:5px}
@media(max-height:430px){.keyboard-open .robot-wrap{padding-top:24px}.keyboard-open .stage-name{font-size:11px}}
</style></head><body><main class="app"><header class="header"><button class="tinybtn" id="home">⌂<br>ホーム</button><div class="title">もじ<span>へんしん</span>ロボ</div><button class="tinybtn" id="sound" aria-pressed="true">♪<br>おと ON</button></header><p class="intro">1もじずつ ロボットの かたちが かわるよ！</p>
<div class="play-dock" id="playDock"><section class="robot-stage" id="stage" aria-label="リアルタイムで変身するロボット"><div class="stage-top">✨ リアルタイム へんしん</div><div class="stage-spark s1">✦</div><div class="stage-spark s2">✦</div><div class="robot-wrap" id="robot"></div><div class="stage-name" id="robotName">もじロボ</div></section>
<section class="console"><label class="section-label" for="letters">ふしぎな もじを いれてね</label><div class="typing"><input id="letters" type="text" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ここに もじを いれてね" aria-label="ロボットになる文字"><button id="clear" aria-label="文字を消す">けす ×</button></div><p class="hint">1もじ うつたび、あたま・からだ・てあし が かわるよ！ 3もじの かたちも ロボに はいるよ！</p><button class="big" id="transform">⚙ へんしん！ ⚙</button></section></div>
<section class="panel"><h2>🎨 いろを かえよう</h2><div class="colors" id="colors"></div></section><div class="actions"><button class="action save" id="save">✦<br>ほぞん</button><button class="action book" id="showGallery">▣<br>ずかん</button><button class="action reset" id="again">↻<br>もういちど</button></div><section class="panel gallery" id="gallery"><h2>📚 つくったロボずかん</h2><div class="saves" id="saves"></div></section><div class="footer">もじへんしんロボ ・ たのしく もじを うとう</div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const colors=['#f2554f','#f78e2e','#f5c928','#85bf34','#21b9bd','#428ed4','#8d5bd7','#ef6bb1'];const robots=[{name:'しかく',head:'box',eye:'round'},{name:'まる',head:'round',eye:'one'},{name:'ピンク',head:'oval',eye:'round'},{name:'みどり',head:'crown',eye:'round'},{name:'ヒーロー',head:'visor',eye:'visor'}];let color=1,sound=true,typed='',saved=[];try{saved=JSON.parse(localStorage.getItem('mojiRobots')||'[]');if(!Array.isArray(saved))saved=[]}catch{};let ctx;
function buzz(){if(navigator.vibrate)try{navigator.vibrate(12)}catch{}}function beep(freq=520){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(freq*1.24,ctx.currentTime+.09);g.gain.setValueAtTime(.05,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.13);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.14)}catch{}}
function safe(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function letters(s){return Array.from(s.trim()).filter(x=>!/^\s$/.test(x)).slice(0,3)}function colorShift(hex,adj){let n=parseInt(hex.slice(1),16),r=Math.min(255,Math.max(0,(n>>16)+adj)),g=Math.min(255,Math.max(0,((n>>8)&255)+adj)),b=Math.min(255,Math.max(0,(n&255)+adj));return `rgb(${r},${g},${b})`}
function makeSVG(s=0,c=color,t=typed,mini=false){let all=Array.from(t).filter(x=>!/^\s$/.test(x)),a=all.slice(0,3),last=all.at(-1)||'',code=last.codePointAt(0)||0,n=all.length;
// Each typed character changes at least the character badge, and drives geometry automatically.
let seed=all.reduce((v,ch,i)=>(Math.imul(v,33)+ch.codePointAt(0)+i)>>>0,7);
let autoShape=n?n%robots.length:0;
let shape=robots[autoShape].head,base=colors[c],light=colorShift(base,40),dark=colorShift(base,-40);
let armVariant=n?(seed>>>3)%3:0, legVariant=n?(seed>>>6)%3:0;
let eyeVariant=n?(seed>>>9)%3:0;let head=shape==='round'?'<ellipse cx="150" cy="102" rx="72" ry="60"/>':shape==='oval'?'<rect x="79" y="51" width="142" height="106" rx="37"/>':shape==='crown'?'<path d="M81 74 L90 47 L110 66 L133 43 L155 66 L178 43 L198 66 L214 47 L219 74 L219 148 Q219 157 208 157 H92 Q81 157 81 148Z"/>':shape==='visor'?'<rect x="75" y="50" width="150" height="104" rx="30"/>':'<rect x="76" y="51" width="148" height="104" rx="14"/>';
let eyes=shape==='round'?'<ellipse cx="150" cy="106" rx="34" ry="30" fill="white"/><circle cx="150" cy="107" r="16" fill="#22394c"/><circle cx="143" cy="100" r="6" fill="white"/>':shape==='visor'?'<rect x="92" y="88" width="116" height="37" rx="18" fill="#17475b"/><ellipse cx="120" cy="106" rx="11" ry="13" fill="#fff"/><ellipse cx="180" cy="106" rx="11" ry="13" fill="#fff"/>':'<ellipse cx="116" cy="103" rx="21" ry="24" fill="white"/><ellipse cx="184" cy="103" rx="21" ry="24" fill="white"/><circle cx="120" cy="105" r="11" fill="#233e50"/><circle cx="180" cy="105" r="11" fill="#233e50"/><circle cx="116" cy="99" r="4" fill="white"/><circle cx="176" cy="99" r="4" fill="white"/>';
let char1=a[0]||'★',char2=a[1]||'⚙',char3=a[2]||'●';const font='font-family="Hiragino Maru Gothic ProN,system-ui,sans-serif" font-weight="900" text-anchor="middle"';let antenna=a.length?`<rect x="146" y="20" width="8" height="36" rx="3" fill="#367e9d"/><circle cx="150" cy="18" r="17" fill="#ffd13c"/><text x="150" y="25" font-size="17" fill="#614e20" ${font}>${safe(char3)}</text>`:'<rect x="146" y="22" width="8" height="32" fill="#367e9d"/><circle cx="150" cy="20" r="12" fill="#ffcb2e"/>';
let arms=[['M104 192 L68 230 L50 218','M196 192 L232 230 L250 218'],['M104 192 L54 177 L34 192','M196 192 L246 177 L266 192'],['M104 192 L75 246 L48 264','M196 192 L225 246 L252 264']][armVariant];
let legs=[['111','166'],['104','173'],['119','159']][legVariant];
let badge= n?`<circle cx="202" cy="73" r="19" fill="#fff4b0" stroke="#e1a928" stroke-width="3"/><text x="202" y="80" font-size="16" fill="#76561d" ${font}>${safe(last)}</text>`:'';
return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 345" role="img" aria-label="${safe(t||'かわいいロボット')}"><ellipse cx="150" cy="331" rx="90" ry="9" fill="#c8d9e0"/><rect x="${legs[0]}" y="260" width="23" height="51" rx="8" fill="#2f80ab"/><rect x="${legs[1]}" y="260" width="23" height="51" rx="8" fill="#2f80ab"/><rect x="104" y="303" width="44" height="23" rx="7" fill="#ef6358"/><rect x="158" y="303" width="44" height="23" rx="7" fill="#ef6358"/><circle cx="125" cy="313" r="5" fill="white"/><circle cx="180" cy="313" r="5" fill="white"/><path d="${arms[0]}" stroke="#3f9bcb" stroke-width="17" fill="none" stroke-linecap="round"/><path d="${arms[1]}" stroke="#3f9bcb" stroke-width="17" fill="none" stroke-linecap="round"/><circle cx="70" cy="228" r="9" fill="#ffd137"/><circle cx="232" cy="228" r="9" fill="#ffd137"/><path d="M46 205 Q25 212 33 235 L48 241 L61 222Z" fill="#ee575b"/><path d="M254 205 Q275 212 267 235 L252 241 L239 222Z" fill="#ee575b"/><path d="M112 177 Q150 167 188 177 L207 265 H93Z" fill="${base}" stroke="${dark}" stroke-width="3"/><circle cx="107" cy="190" r="13" fill="#94c83c"/><circle cx="193" cy="190" r="13" fill="#94c83c"/><rect x="117" y="195" width="66" height="52" rx="10" fill="#fffdf2"/><text x="150" y="231" font-size="31" fill="${dark}" ${font}>${safe(last||char2)}</text><circle cx="134" cy="250" r="4" fill="#fb6d6f"/><circle cx="150" cy="250" r="4" fill="#ffd23d"/><circle cx="166" cy="250" r="4" fill="#60bf8d"/>${antenna}<rect x="66" y="91" width="24" height="31" rx="9" fill="#ffcb38"/><rect x="210" y="91" width="24" height="31" rx="9" fill="#ffcb38"/><g fill="${light}" stroke="${dark}" stroke-width="4">${head}</g>${eyes}${badge}<path d="M137 130 Q150 143 163 130" stroke="#26445a" stroke-width="4" stroke-linecap="round" fill="none"/>${a.length?`<rect x="131" y="67" width="38" height="25" rx="9" fill="#ffffff" opacity=".96"/><text x="150" y="86" font-size="19" fill="${dark}" ${font}>${safe(char1)}</text>`:''}</svg>`}
function draw(animate=false){$('robot').innerHTML=makeSVG();$('robotName').textContent=typed.trim()?`${Array.from(typed.trim()).slice(0,8).join('')}ロボ`:'もじロボ';if(animate){$('stage').classList.remove('pop');void $('stage').offsetWidth;$('stage').classList.add('pop')}}function renderColors(){$('colors').innerHTML=colors.map((c,i)=>`<button class="swatch ${color===i?'active':''}" data-color="${i}" style="background:${c}" aria-label="${i+1}ばんの色" aria-pressed="${color===i}"></button>`).join('')};function renderSaved(){$('saves').innerHTML=saved.length?saved.map((x,i)=>`<button class="saved" data-saved="${i}">${makeSVG(0,x.color,x.text,true)}<small>${safe(x.text||'もじロボ')}</small></button>`).join(''):'<p class="empty">まだ ロボットが いないよ。ほぞんしてね！</p>'}
$('colors').addEventListener('click',e=>{let b=e.target.closest('[data-color]');if(b){color=Number(b.dataset.color);renderColors();draw(true);buzz();beep(640)}});$('letters').addEventListener('input',e=>{typed=e.target.value;draw(true);buzz();beep(440+Math.min(300,Array.from(typed).length*22))});$('clear').onclick=()=>{typed='';$('letters').value='';draw(true);buzz();$('letters').focus()};$('transform').onclick=()=>{draw(true);buzz();beep(760);$('letters').blur()};$('sound').onclick=()=>{sound=!sound;$('sound').innerHTML=sound?'♪<br>おと ON':'♪<br>おと OFF';$('sound').setAttribute('aria-pressed',String(sound));if(sound)beep()};$('save').onclick=()=>{saved.unshift({text:typed,color});saved=saved.slice(0,30);try{localStorage.setItem('mojiRobots',JSON.stringify(saved))}catch{};renderSaved();$('gallery').classList.add('open');$('showGallery').textContent='▣ ずかん';draw(true);buzz();beep(780);$('gallery').scrollIntoView({behavior:'smooth',block:'nearest'})};$('showGallery').onclick=()=>{$('gallery').classList.toggle('open');renderSaved();buzz()};$('saves').onclick=e=>{let b=e.target.closest('[data-saved]');if(!b)return;let x=saved[Number(b.dataset.saved)];color=x.color;typed=x.text;$('letters').value=typed;renderColors();draw(true);window.scrollTo({top:0,behavior:'smooth'})};$('again').onclick=()=>{typed='';color=Math.floor(Math.random()*colors.length);$('letters').value='';renderColors();draw(true);buzz();beep(650)};$('home').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});$('letters').blur()};
// visualViewport measures the actual area above iOS's kana/flick keyboard.
// The stage and input stay inside a single fixed dock; no scrolling is needed while typing.
const field=$('letters');let keyboardMode=false;let focusTimer;
function resizeKeyboardDock(){
 const vv=window.visualViewport;
 const h=vv?vv.height:window.innerHeight;
 const top=vv?vv.offsetTop:0;
 const screenH=window.innerHeight;
 const covered=screenH-(h+top);
 const active=document.activeElement===field;
 const on=active && covered>90;
 document.body.classList.toggle('keyboard-open',on);
 keyboardMode=on;
 if(on){document.documentElement.style.setProperty('--visual-height',Math.round(h)+'px');document.documentElement.style.setProperty('--visual-top',Math.round(top)+'px')}
}
field.addEventListener('focus',()=>{resizeKeyboardDock();clearTimeout(focusTimer);focusTimer=setTimeout(resizeKeyboardDock,250)});
field.addEventListener('blur',()=>{clearTimeout(focusTimer);setTimeout(resizeKeyboardDock,70)});
if(window.visualViewport){window.visualViewport.addEventListener('resize',resizeKeyboardDock);window.visualViewport.addEventListener('scroll',resizeKeyboardDock)}
window.addEventListener('resize',resizeKeyboardDock);
window.addEventListener('orientationchange',()=>setTimeout(resizeKeyboardDock,250));
renderColors();renderSaved();draw();
})();</script></body></html>
